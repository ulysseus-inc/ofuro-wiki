mutation adminValidateUserCsv($csv: String!) {
  adminValidateUserCsv(csv: $csv) {
    okCount
    ngCount
    rows {
      line
      email
      name
      ok
      error
    }
  }
}

mutation adminImportUsers($csv: String!) {
  adminImportUsers(csv: $csv) {
    okCount
    ngCount
    rows {
      line
      email
      name
      ok
      error
    }
  }
}
