query adminAuditLogs($actor: String, $action: String, $from: String, $to: String, $skip: Int, $take: Int) {
  adminAuditLogs(actor: $actor, action: $action, from: $from, to: $to, skip: $skip, take: $take) {
    totalCount
    items {
      id
      createdAt
      action
      actorEmail
      actorName
      targetType
      targetId
      targetName
      ip
      detail
    }
  }
}

query adminAuditLogsCsv($actor: String, $action: String, $from: String, $to: String) {
  adminAuditLogsCsv(actor: $actor, action: $action, from: $from, to: $to)
}
